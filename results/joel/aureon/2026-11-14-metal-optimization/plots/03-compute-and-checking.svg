  <g id="text_16">
   <text style="font-weight: 600; font-size: 27px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #171717" x="63.36" y="60.115781" transform="rotate(-0 63.36 60.115781)">Compute + complete checking: 13.7× faster</text>
  </g>
  <g id="text_17">
   <text style="font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #404040" x="63.36" y="93.557344" transform="rotate(-0 63.36 93.557344)">Inputs resident · original trig formula · safe math mode · 256 threads</text>
  </g>
  <g id="text_18">
   <text style="font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #404040" x="414.72" y="118.8" transform="rotate(-0 414.72 118.8)">○  Individual trial     ◆  Median</text>
  </g>
  <g id="text_19">
   <text style="font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: end; fill: #404040" x="1076.832" y="118.8" transform="rotate(-0 1076.832 118.8)">Median (ms)</text>
  </g>
  <g id="text_20">
   <text style="font-weight: 600; font-size: 16.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1f6f5f" x="63.36" y="599.04" transform="rotate(-0 63.36 599.04)">Parallel checking and direct output access account for most of the gain.</text>
  </g>
  <g id="text_21">
   <text style="font-size: 13.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #404040" x="63.36" y="632.16" transform="rotate(-0 63.36 632.16)">Apple M5 Max · 10 randomized trials per row · Every output passed all 300 million coordinate checks.</text>
  </g>
  <g id="text_22">
   <text style="font-size: 13.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #404040" x="63.36" y="655.2" transform="rotate(-0 63.36 655.2)">Shared output is CPU-visible after GPU completion; it avoids an extra 1.2 GB copy, with no separate owned copy.</text>
  </g>
  <g id="text_23">
   <text style="font-size: 13.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #404040" x="63.36" y="678.24" transform="rotate(-0 63.36 678.24)">Timing excludes input preparation, compilation and an additional independent serial-oracle verification.</text>
  </g>
  <g id="text_24">
   <text style="font-size: 13.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #404040" x="63.36" y="701.28" transform="rotate(-0 63.36 701.28)">All check summaries matched that oracle exactly. Circles show individual trials; diamonds show medians.</text>
  </g>
 </g>
